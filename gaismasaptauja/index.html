<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gaismas dārza aptauja</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, festive, simple — a winter evening invitation for colleagues
   IDEA: a garden of lights at night; each date is a glowing lantern you pick
   PICTURE: a string of lights across the top; the four date lanterns are the form
   COLOUR and TYPE: deep winter-teal night, warm light #ffe9a8, coral accent; DM Serif Display + Manrope
   LAYOUT: one calm column — title, lights, name, four date cards, send; results grouped by date below */
:root{color-scheme:dark;--bg:#0b2426;--bg2:#103236;--card:#143b40;--line:#24555a;--ink:#f2f6f2;--mut:#a9c2bf;--glow:#ffe9a8;--acc:#ff7a59}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(1200px 500px at 50% -10%,#174a4c 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:720px;margin:0 auto;padding:0 max(5vw,16px) 64px}
.lights{display:block;width:100%;height:90px}
.bulb{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){.bulb{animation:none}}
h1{font:400 clamp(32px,6vw,50px)/1.05 "DM Serif Display",Georgia,serif;margin:8px 0 10px;text-wrap:balance}
.lead{color:var(--mut);margin:0 0 28px;max-width:60ch}
label.f{display:block;font-weight:600;margin:0 0 8px}
input[type=text]{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);min-height:48px}
input[type=text]:focus-visible,button:focus-visible,.opt input:focus-visible+span{outline:3px solid var(--glow);outline-offset:2px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:24px 0 8px;border:0;padding:0}
.opts legend{font-weight:600;margin-bottom:8px;padding:0}
.opt{position:relative;display:block;cursor:pointer}
.opt input{position:absolute;opacity:0;inset:0}
.opt>span{display:block;padding:16px;border-radius:16px;background:var(--card);border:2px solid transparent;transition:border-color .15s,box-shadow .15s}
.opt:hover>span{border-color:var(--line)}
.opt input:checked+span{border-color:var(--glow);box-shadow:0 0 0 4px rgba(255,233,168,.12),0 0 28px rgba(255,233,168,.18)}
.d{font:400 30px/1 "DM Serif Display",Georgia,serif;white-space:nowrap}
.wd{color:var(--mut);font-size:14px}
.cnt{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-top:12px;color:var(--mut)}
.bar{display:block;height:6px;border-radius:3px;background:#0b2426;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--glow);border-radius:3px;transition:width .3s}
.top{color:var(--acc);font-weight:800}
.act{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px}
button{font:inherit;font-weight:800;border:0;border-radius:12px;min-height:48px;padding:0 22px;cursor:pointer}
.go{background:var(--glow);color:#1a1405}
.go:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.msg{font-size:15px;color:var(--mut)}
.msg.ok{color:var(--glow)}.msg.err{color:var(--acc)}
h2{font:400 28px/1.1 "DM Serif Display",Georgia,serif;margin:56px 0 6px}
.res{display:grid;gap:12px;margin-top:16px}
.grp{background:var(--bg2);border-radius:16px;padding:14px 16px}
.grp h3{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.grp h3 b{color:var(--glow)}
.names{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.names li{background:var(--card);border-radius:999px;padding:4px 12px;font-size:15px}
.empty{color:var(--mut);font-size:15px;margin:0}
.note{color:var(--mut);font-size:13px;margin-top:28px}
@media(max-width:600px){.opts{grid-template-columns:minmax(0,1fr)}.opt>span{display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:baseline}.cnt,.bar{grid-column:1/-1}}
</style>
</head>
<body>
<div id="lights"></div>
<div class="wrap">
  <h1>Vēlos apmeklēt Gaismas dārzu</h1>
  <p class="lead">Ieraksti savu vārdu un atzīmē vienu datumu, kas Tev der vislabāk.</p>
  <form id="f" novalidate>
    <label class="f" for="name">Vārds un uzvārds</label>
    <input type="text" id="name" name="name" maxlength="60" autocomplete="name" placeholder="Piem., Anna Bērziņa">
    <fieldset class="opts" id="opts"><legend>Kurš datums Tev der?</legend></fieldset>
    <div class="act"><button class="go" id="send" type="submit">Nosūtīt atbildi</button><span class="msg" id="msg" role="status" aria-live="polite"></span></div>
  </form>
  <h2>Kurš kuru datumu izvēlējies</h2>
  <p class="lead" style="margin:0">Kopā atbildējuši: <b id="total">–</b></p>
  <div class="res" id="res"><p class="empty">Ielādēju atbildes…</p></div>
  <p class="note">Atbildes redz visi, kam ir saite uz šo aptauju.</p>
</div>
<script src="../themes/config.js"></script>
<script>
(() => {
  'use strict';
  const DATES = [
    {id:'2026-12-06', d:'6. decembris', wd:'svētdiena'},
    {id:'2026-12-13', d:'13. decembris', wd:'svētdiena'},
    {id:'2026-12-20', d:'20. decembris', wd:'svētdiena'},
    {id:'2026-12-27', d:'27. decembris', wd:'svētdiena'}
  ];
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm = s => s.trim().replace(/\s+/g, ' ').toLocaleLowerCase('lv');
  const votes = n => n + ' ' + (n % 10 === 1 && n % 100 !== 11 ? 'balss' : 'balsis');
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v){ try { localStorage.setItem(k, v); } catch { /* optional convenience */ } }
  };
  let responses = [], loaded = false, busy = false, requestNumber = 0;

  async function rpc(fn, body){
    const cfg = window.THEME_POLL_CONFIG || {};
    if (!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(cfg.supabaseUrl || '') || !cfg.publishableKey) throw new Error('not configured');
    const r = await fetch(cfg.supabaseUrl + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: {apikey: cfg.publishableKey, 'Content-Type': 'application/json'},
      body: JSON.stringify(body || {}),
      cache: 'no-store',
      signal: AbortSignal.timeout(15000)
    });
    if (!r.ok) throw new Error(fn + ' ' + r.status);
    return r.json();
  }

  function setMsg(t, k){ const m = $('msg'); m.textContent = t; m.className = 'msg ' + (k || ''); }

  function lights(){
    const n = 15; let p = '', b = '';
    for (let i = 0; i < n; i++){
      const x = 20 + i * (680/(n-1)), y = 22 + Math.sin(i/(n-1)*Math.PI) * 34;
      p += (i ? ' L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
      const c = ['#ffe9a8','#ff7a59','#bdf2e0'][i%3];
      b += `<g class="bulb" style="animation-delay:${(i*0.37%3).toFixed(2)}s"><circle cx="${x.toFixed(1)}" cy="${(y+12).toFixed(1)}" r="14" fill="${c}" opacity=".18"/><circle cx="${x.toFixed(1)}" cy="${(y+12).toFixed(1)}" r="6" fill="${c}"/></g>`;
    }
    $('lights').innerHTML = `<svg class="lights" viewBox="0 0 720 90" preserveAspectRatio="none" aria-hidden="true"><path d="${p}" fill="none" stroke="#3d6b6a" stroke-width="1.5"/>${b}</svg>`;
  }

  // The date cards are built once so typing and the chosen radio survive a refresh.
  function buildOptions(){
    $('opts').insertAdjacentHTML('beforeend', DATES.map(d =>
      `<label class="opt"><input type="radio" name="date" value="${d.id}"><span>
        <span class="d">${d.d}</span> <span class="wd">${d.wd}</span>
        <span class="cnt"><span data-n="${d.id}">–</span><span class="top" data-top="${d.id}" hidden>Populārākais</span></span>
        <span class="bar"><i data-bar="${d.id}" style="width:0"></i></span></span></label>`).join(''));
  }

  function paint(){
    const by = {}; DATES.forEach(d => by[d.id] = []);
    responses.forEach(r => { if (by[r.date_id]) by[r.date_id].push(r); });
    Object.values(by).forEach(a => a.sort((x, y) => x.name.localeCompare(y.name, 'lv')));
    const total = responses.length;
    const max = Math.max(0, ...DATES.map(d => by[d.id].length));
    DATES.forEach(d => {
      const n = by[d.id].length;
      document.querySelector(`[data-n="${d.id}"]`).textContent = votes(n);
      document.querySelector(`[data-top="${d.id}"]`).hidden = !(n && n === max);
      document.querySelector(`[data-bar="${d.id}"]`).style.width = (total ? Math.round(n / total * 100) : 0) + '%';
    });
    $('total').textContent = total;
    $('res').innerHTML = DATES.map(d => {
      const list = by[d.id];
      return `<div class="grp"><h3><span>${d.d}</span><b>${list.length}</b></h3>${list.length
        ? `<ul class="names">${list.map(r => `<li>${esc(r.name)}</li>`).join('')}</ul>`
        : '<p class="empty">Vēl neviens nav izvēlējies šo datumu.</p>'}</div>`;
    }).join('');
    syncButton();
  }

  // If the typed name already answered, offer to change that answer.
  function mine(){ const n = norm($('name').value); return n ? responses.find(r => norm(r.name) === n) : null; }
  function syncButton(){
    $('send').textContent = mine() ? 'Mainīt atbildi' : 'Nosūtīt atbildi';
    $('send').disabled = busy;
  }

  async function load(){
    const number = ++requestNumber;
    try {
      const data = await rpc('get_gaisma_results');
      if (number !== requestNumber) return;
      if (!Array.isArray(data)) throw new Error('Unexpected response');
      responses = data.filter(r => r && typeof r.name === 'string' && typeof r.date_id === 'string');
      const first = !loaded; loaded = true;
      paint();
      if (first){
        const m = mine();
        if (m && !document.querySelector('input[name=date]:checked')){
          const r = document.querySelector(`input[name=date][value="${m.date_id}"]`); if (r) r.checked = true;
        }
      }
    } catch {
      if (number !== requestNumber) return;
      if (!loaded) $('res').innerHTML = '<p class="empty">Neizdevās ielādēt atbildes. Lūdzu, pārlādē lapu.</p>';
    }
  }

  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    if (busy) return;
    const name = $('name').value.trim().replace(/\s+/g, ' ');
    const pick = document.querySelector('input[name=date]:checked');
    if (!name){ setMsg('Lūdzu, ieraksti savu vārdu.', 'err'); $('name').focus(); return; }
    if (!pick){ setMsg('Lūdzu, atzīmē vienu datumu.', 'err'); return; }
    const d = DATES.find(x => x.id === pick.value);
    busy = true; syncButton(); setMsg('Saglabāju…');
    try {
      await rpc('submit_gaisma_response', {p_name: name, p_date: d.id});
      store.set('gd-name', name);
      $('name').value = name;
      setMsg('Paldies, ' + name + '! Tava izvēle: ' + d.d + '.', 'ok');
      busy = false;
      await load();
    } catch {
      setMsg('Neizdevās saglabāt. Lūdzu, mēģini vēlreiz.', 'err');
    } finally { busy = false; syncButton(); }
  });

  $('name').addEventListener('input', syncButton);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !busy) load(); });

  lights();
  buildOptions();
  $('name').value = store.get('gd-name') || '';
  syncButton();
  load();
})();
</script>
</body>
</html>
